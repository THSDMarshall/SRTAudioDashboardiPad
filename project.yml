name: SRTAudioDashboard
options:
  bundleIdPrefix: uk.co.stocktonroundtable
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '2'
    SUPPORTS_MACCATALYST: 'NO'
    GENERATE_INFOPLIST_FILE: 'YES'
    INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
    INFOPLIST_KEY_NSMicrophoneUsageDescription: 'Used to detect announcements from the USB microphone for automatic music ducking.'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  SRTAudioDashboard:
    type: application
    platform: iOS
    sources:
      - path: SRTAudioDashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.stocktonroundtable.SRTAudioDashboard
        INFOPLIST_KEY_UIRequiresFullScreen: 'NO'
        IPHONEOS_DEPLOYMENT_TARGET: '16.0'
        TARGETED_DEVICE_FAMILY: '2'
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: 'NO'
